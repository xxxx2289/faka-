name: Build User App APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: acg-faka-user-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
